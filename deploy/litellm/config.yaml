model_list:
  - model_name: qwen3.7-plus
    litellm_params:
      model: openai/qwen3.7-plus
      api_key: os.environ/SMARTLECT_MODEL_API_KEY
      base_url: os.environ/SMARTLECT_MODEL_BASE_URL
      drop_params: true
  - model_name: text-embedding-v4
    litellm_params:
      model: openai/text-embedding-v4
      api_key: os.environ/SMARTLECT_EMBEDDING_API_KEY
      base_url: os.environ/SMARTLECT_EMBEDDING_BASE_URL
      drop_params: true
  - model_name: gte-rerank-v2
    litellm_params:
      model: dashscope/gte-rerank-v2
      api_key: os.environ/SMARTLECT_RERANK_API_KEY
      drop_params: true

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
