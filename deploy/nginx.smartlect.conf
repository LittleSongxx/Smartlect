# keepalive pool: without it every request opens and tears down a TCP
# connection to the gateway; with it the worker reuses persistent links.
upstream smartlect_gateway {
    server 127.0.0.1:18080;
    keepalive 64;
}

# Shared proxy locations. Included by the HTTPS apex and HTTP-IP servers.
# 生产同步到 /etc/nginx/snippets/smartlect-proxy.conf
# 证书：/etc/letsencrypt/live/smartlect.cn/ ；续期由 certbot.timer 处理。

# HTTPS 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smartlect.cn;

    ssl_certificate /etc/letsencrypt/live/smartlect.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartlect.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /admin/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_read_timeout 120s;
    }

    location /admin-api/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://smartlect_gateway;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}

# www → apex
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.smartlect.cn;

    ssl_certificate /etc/letsencrypt/live/smartlect.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartlect.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://smartlect.cn$request_uri;
}

# HTTP apex → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smartlect.cn;
    return 301 https://smartlect.cn$request_uri;
}

# 过渡期保留 IP 直访（HTTP）。不要对 IP 套本证书，SNI 对不上。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 39.107.102.244 _;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /admin/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_read_timeout 120s;
    }

    location /admin-api/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://smartlect_gateway;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
