# keepalive pool: without it every request opens and tears down a TCP
# connection to the gateway; with it the worker reuses persistent links.
upstream smartlect_gateway {
    server 127.0.0.1:18080;
    keepalive 64;
}
# Smartlect 单域名入口：/ 与静态资源走用户端(18180)，/api/ 直连网关(18080，
# T0-4 起去掉 vite preview 中转)，/admin/ 与 /admin-api/ 走管理端(18181)。
# SSE（/api/assistant/**）关缓冲、长读超时。
# 生产同步到 /etc/nginx/sites-available/smartlect ；证书由 certbot --nginx 写入。
server {
    listen 80;
    listen [::]:80;
    server_name smartlect.cn www.smartlect.cn 39.107.102.244 _;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /admin/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_read_timeout 120s;
    }

    location /admin-api/ {
        proxy_pass http://127.0.0.1:18181;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://smartlect_gateway;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
