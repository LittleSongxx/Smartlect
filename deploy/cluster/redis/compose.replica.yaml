# Redis 副本（node2/node3）—— host 网络 6379，复制 node1 的主库
#
# 用法（node2/node3 各自执行）：
#   cd /opt/cluster/redis && REPLICA_ANNOUNCE_IP=<本机内网IP> \
#     docker compose -f compose.replica.yaml --env-file .env up -d --wait
#
# replica-announce-ip 必填：host 网络下副本默认上报容器内的地址，sentinel 会记错。

services:
  redis-replica:
    image: redis:7.4.7-alpine
    container_name: redis-replica
    network_mode: host
    command: >
      sh -ec 'exec redis-server
      --appendonly yes
      --maxmemory 192mb --maxmemory-policy noeviction
      --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD"
      --replicaof ${NODE1_IP:?source nodes.env} ${REDIS_PORT:-6379}
      --replica-announce-ip ${REPLICA_ANNOUNCE_IP:?set to this node IP} --replica-announce-port ${REDIS_PORT:-6379}'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run gen-cluster-env.sh first}
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -h 127.0.0.1 -p 6379 -a "$$REDIS_PASSWORD" --no-auth-warning info replication | grep -q "role:slave"']
      interval: 10s
      timeout: 5s
      retries: 30
