# Redis Sentinel（node1/node2/node3 各一个实例）—— host 网络 26379
#
# 用法（每个节点各自执行，用 SENTINEL_CONF_DIR 区分本机配置目录）：
#   cd /opt/cluster/sentinel && SENTINEL_CONF_DIR=conf-node2 \
#     docker compose -f compose.sentinel.yaml up -d --wait
#
# 配置以**目录**挂载（sentinel 会 CONFIG REWRITE 回写 sentinel.conf）；
# sentinel.conf 由 build-redis.sh 现场生成（含 redis 密码，不入库）。

services:
  redis-sentinel:
    image: redis:7.4.7-alpine
    container_name: redis-sentinel
    network_mode: host
    command: ["redis-sentinel", "/data/sentinel.conf"]
    volumes:
      - ./${SENTINEL_CONF_DIR:?set to conf-node1/2/3}:/data
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -h 127.0.0.1 -p 26379 ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 30
