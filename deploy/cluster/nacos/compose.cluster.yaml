# Nacos 集群成员（node1/node2/node3 各一个实例）—— host 网络 8848/9848/7848，Raft 3 节点
#
# 用法（每个节点各自执行）：
#   cd /opt/cluster/nacos && NACOS_NODE_NAME=smartlect-node2 --env-file .env \
#     docker compose -f compose.cluster.yaml up -d
#
# 三个成员共用 node1 MySQL 的 smartlect_nacos 库（集群期 mysql 已加内网绑定），
# 所以从单机 standalone 切过来无需迁移配置数据。
# 注意：集群模式下单成员过不了 readiness 仲裁，必须三成员一起拉起（见 build-nacos.sh）。

services:
  nacos-node:
    image: nacos/nacos-server:v2.5.3
    container_name: nacos-c${NACOS_NODE_SLOT:?set to 1/2/3}
    hostname: ${NACOS_NODE_NAME:?source nodes.env}
    network_mode: host
    environment:
      MODE: cluster
      NACOS_SERVERS: "${NODE1_NAME}:8848 ${NODE2_NAME}:8848 ${NODE3_NAME}:8848"
      PREFER_HOST_MODE: hostname
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?run gen-cluster-env.sh first}
      NACOS_AUTH_IDENTITY_KEY: smartlect-server
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_IDENTITY:?run gen-cluster-env.sh first}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${NODE1_IP:?source nodes.env}
      MYSQL_SERVICE_PORT: ${MYSQL_HOST_PORT:-13306}
      MYSQL_SERVICE_DB_NAME: smartlect_nacos
      MYSQL_SERVICE_USER: smartlect_nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD:?run gen-cluster-env.sh first}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8848/nacos/v1/console/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
