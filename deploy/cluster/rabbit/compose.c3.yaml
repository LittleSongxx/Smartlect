# RabbitMQ 集群成员 3/3（node3）—— host 网络；首次 up 后由 build-rabbit.sh 执行 join_cluster
#
# 用法（node3）：
#   cd /opt/cluster/rabbit && docker compose -f compose.c3.yaml --env-file .env up -d --wait

services:
  rabbit-c3:
    image: rabbitmq:4.2.9-management
    container_name: rabbit-c3
    hostname: ${NODE3_NAME:?source nodes.env}
    network_mode: host
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?run gen-cluster-env.sh first}
      RABBITMQ_NODENAME: rabbit@${NODE3_NAME:?source nodes.env}
    volumes:
      - rabbit-c3-data:/var/lib/rabbitmq
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-smartlect.conf:ro
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  rabbit-c3-data:
