# RabbitMQ 集群成员 1/3（node1，种子节点）—— host 网络，Erlang 分布端口直通
#
# 用法（node1）：
#   cd /opt/cluster/rabbit && docker compose -f compose.c1.yaml --env-file .env up -d --wait
# 数据卷为集群期新建：单机期的 smartlect_rabbit 卷原样保留，回退即恢复旧 broker。
# 拓扑（exchange/queue/binding）由 build-rabbit.sh 从**当前单机 broker 导出**后导入，不迁移卷。

services:
  rabbit-c1:
    image: rabbitmq:4.2.9-management
    container_name: rabbit-c1
    hostname: ${NODE1_NAME:?source nodes.env}
    network_mode: host
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?run gen-cluster-env.sh first}
      RABBITMQ_NODENAME: rabbit@${NODE1_NAME:?source nodes.env}
    volumes:
      - rabbit-c1-data:/var/lib/rabbitmq
      - ./rabbitmq-cluster.conf:/etc/rabbitmq/conf.d/20-smartlect.conf:ro
      - ./defs.json:/defs/defs.json:ro
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  rabbit-c1-data:
