# Canal 实例配置：连接凭据经 startup.sh 注入（与 canal.properties 同机制）。
# 订阅面刻意收窄到 product 库——商品索引的增量源只有 product_info；
# 扩大订阅须同步评估消费端（ProductIndexConsumer）的表过滤与幂等口径。
canal.instance.mysql.slaveId = 2050
canal.instance.gtidon = false
canal.instance.master.address = ${CANAL_MYSQL_ADDRESS}
canal.instance.dbUsername = ${CANAL_MYSQL_USER}
canal.instance.dbPassword = ${CANAL_MYSQL_PASSWORD}
canal.instance.connectionCharset = UTF-8

canal.instance.filter.regex = smartlect_product\\..*
canal.instance.filter.black.regex = .*\\.gacl_.*
canal.instance.transactionLog = false
canal.instance.network.soTimeout = 30000

# 位点：容器无持久卷时每次从头订阅（首次部署无丢失，全量由初始化器兜底）。
canal.instance.tsdb.enable = false
