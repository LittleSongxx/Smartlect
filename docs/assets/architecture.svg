<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-label="Smartlect 架构">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .layer { font-size: 14px; font-weight: 700; fill: #1e293b; }
      .body { font-size: 12.5px; fill: #334155; }
      .chip { font-size: 11px; fill: #fff; font-weight: 600; }
      .sub { font-size: 10.5px; fill: #94a3b8; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1120" height="780" fill="#f8fafc"/>
  <text x="560" y="32" text-anchor="middle" class="title">Smartlect — 交易权威 + 有界 ReAct 导购 Agent</text>

  <!-- 浏览器层 -->
  <rect x="30" y="52" width="1060" height="54" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="50" y="76" class="layer">浏览器</text>
  <text x="120" y="76" class="body">用户端 Vue 3 + TypeScript（18180）</text>
  <text x="420" y="76" class="body">管理端 Vue 3（18181）</text>
  <text x="640" y="76" class="body">SSE 流式 + 提案确认卡</text>

  <line x1="560" y1="106" x2="560" y2="130" class="arrow"/>
  <text x="590" y="124" class="sub">HTTPS / SSE</text>

  <!-- 网关层 -->
  <rect x="230" y="132" width="660" height="50" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="250" y="156" class="layer">Spring Cloud Gateway（18080）</text>
  <text x="490" y="156" class="body">Sa-Token 统一校验 · Sentinel 限流 · 剥离伪造身份头</text>
  <text x="250" y="173" class="sub">/api/** → 用户端服务     /admin-api/** → 管理端服务     /api/assistant/** → assistant</text>

  <!-- 双向箭头 -->
  <line x1="330" y1="182" x2="330" y2="210" class="arrow"/>
  <text x="260" y="202" class="sub">@SaCheckLogin ×29</text>
  <line x1="660" y1="182" x2="660" y2="210" class="arrow"/>
  <text x="690" y="202" class="sub">Cookie introspect</text>

  <!-- Java 交易权威层 -->
  <rect x="30" y="212" width="620" height="128" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="50" y="238" class="layer">Java 交易权威 — Spring Cloud（9 服务）</text>
  <rect x="50" y="250" width="90" height="26" rx="6" fill="#16a34a"/><text x="62" y="267" class="chip">gateway</text>
  <rect x="148" y="250" width="68" height="26" rx="6" fill="#16a34a"/><text x="160" y="267" class="chip">user</text>
  <rect x="224" y="250" width="82" height="26" rx="6" fill="#16a34a"/><text x="236" y="267" class="chip">product</text>
  <rect x="314" y="250" width="70" height="26" rx="6" fill="#16a34a"/><text x="326" y="267" class="chip">stock</text>
  <rect x="392" y="250" width="66" height="26" rx="6" fill="#16a34a"/><text x="404" y="267" class="chip">cart</text>
  <rect x="466" y="250" width="76" height="26" rx="6" fill="#16a34a"/><text x="478" y="267" class="chip">order</text>
  <rect x="550" y="250" width="60" height="26" rx="6" fill="#16a34a"/><text x="562" y="267" class="chip">pay</text>
  <rect x="50" y="282" width="80" height="26" rx="6" fill="#16a34a"/><text x="62" y="299" class="chip">coupon</text>
  <rect x="138" y="282" width="74" height="26" rx="6" fill="#16a34a"/><text x="150" y="299" class="chip">admin</text>
  <text x="230" y="300" class="body">Nacos 注册 · OpenFeign · PageHelper · Redisson · Sa-Token 1.39</text>
  <text x="50" y="330" class="body">Outbox 可靠消息 · 退款 Saga · 命令幂等账本 · 金额分摊 CHECK · 秒杀 Lua · 条件 UPDATE 不超卖</text>

  <!-- assistant 层 -->
  <rect x="690" y="212" width="400" height="128" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="710" y="238" class="layer">Shopping Agent — Python 3.11</text>
  <text x="710" y="258" class="body">FastAPI 18000 · LangGraph 1.2 · 有界 ReAct（手写三节点）</text>
  <text x="710" y="276" class="body">17 工具 · 预算墙（模型≤6 · 工具≤10 · 检索≤2 · 90s）</text>
  <text x="710" y="294" class="body">task_dispatch → 1–3 子智能体（create_react_agent）并发</text>
  <text x="710" y="312" class="body">openai SDK · 端点/模型白名单 · 持久化提案 HITL</text>
  <text x="710" y="330" class="sub">trim_messages 上下文裁剪</text>

  <!-- Java ↔ assistant 箭头 -->
  <line x1="652" y1="276" x2="688" y2="276" class="arrow" stroke-dasharray="4,3"/>
  <text x="640" y="270" class="sub" text-anchor="end">报价/下单/查询</text>

  <!-- 存储层 -->
  <rect x="30" y="368" width="1060" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="50" y="394" class="layer">存储与中间件</text>
  <rect x="50" y="406" width="130" height="28" rx="6" fill="#ef4444"/><text x="60" y="425" class="chip">MySQL 8.4（10 库）</text>
  <rect x="190" y="406" width="80" height="28" rx="6" fill="#ef4444"/><text x="200" y="425" class="chip">Redis 7.4</text>
  <rect x="280" y="406" width="110" height="28" rx="6" fill="#ef4444"/><text x="290" y="425" class="chip">RabbitMQ 4.2</text>
  <rect x="400" y="406" width="80" height="28" rx="6" fill="#ef4444"/><text x="410" y="425" class="chip">Nacos 2.5</text>
  <rect x="490" y="406" width="80" height="28" rx="6" fill="#ef4444"/><text x="500" y="425" class="chip">Sa-Token</text>
  <text x="50" y="458" class="body">Sa-Token 会话（token:login: / adminToken:login:）· Redisson RLock + RRateLimiter · Outbox 租约重试</text>

  <!-- 检索层 -->
  <rect x="30" y="490" width="1060" height="88" rx="10" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="50" y="516" class="layer">RAG 检索（assistant 内）</text>
  <rect x="50" y="528" width="200" height="32" rx="6" fill="#ec4899"/><text x="60" y="549" class="chip">Elasticsearch 8.19（smartcn BM25）</text>
  <rect x="270" y="528" width="170" height="32" rx="6" fill="#ec4899"/><text x="280" y="549" class="chip">Qdrant 1.15（HNSW dense）</text>
  <rect x="460" y="528" width="70" height="32" rx="6" fill="#ec4899"/><text x="478" y="549" class="chip">RRF</text>
  <rect x="550" y="528" width="110" height="32" rx="6" fill="#ec4899"/><text x="560" y="549" class="chip">gte-rerank</text>
  <text x="690" y="549" class="body">→ top8 → 引用 ≤4 · 拒答阈值 · 未配置回退内存 BM25</text>
  <text x="50" y="572" class="body">知识发布流：DRAFT → 异步索引 → PUBLISHED → 才可检索 · 价格库存不进向量，每次实时查 Java</text>

  <!-- 鉴权条 -->
  <rect x="30" y="600" width="1060" height="52" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="50" y="624" class="layer">Sa-Token 1.39（ADR-0011）</text>
  <text x="250" y="624" class="body">用户端 StpUtil（token）· 管理端 StpAdminLogic（adminToken，isConcurrent=false）</text>
  <text x="50" y="643" class="body">网关 GlobalFilter 统一校验 · 服务端 @SaCheckLogin ×29 · @SaCheckPermission ×5 · SmartlectStpInterface</text>

  <!-- 核心设计条 -->
  <rect x="30" y="668" width="1060" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="692" class="layer">电商核心设计</text>
  <text x="180" y="692" class="body">条件 UPDATE 不超卖 · 秒杀 Lua 预扣 · 命令幂等账本 · Outbox · 退款 Saga · 金额分摊 CHECK · mock 支付 intent 权威</text>
  <text x="50" y="711" class="body">ADR-0006 删 Seata · ADR-0008 推荐/归因/worker 线退役 · PageHelper 分页 · Redisson 锁/限流</text>

  <text x="560" y="762" text-anchor="middle" class="sub">Smartlect · 2026-10 收敛重构 · ADR 0006–0012</text>
</svg>
