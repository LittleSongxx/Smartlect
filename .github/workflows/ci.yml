name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback:
        description: "回滚到上一个 release bundle（不部署新代码）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn test（testcontainers 自带 MySQL）
        run: mvn -B -f backend/pom.xml test

  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装锁定依赖 + 本包
        run: |
          pip install -r assistant/requirements.lock
          pip install --no-deps --no-build-isolation ./assistant
      - name: unittest
        working-directory: assistant
        run: python -m unittest discover -s tests
      # The MySQL-backed contract tests own one disposable container each and skip
      # themselves without this flag; leaving it unset is how 18 real failures stayed
      # invisible while the suite reported green (142 skips).
      - name: unittest（真实 MySQL 契约测试）
        working-directory: assistant
        env:
          SMARTLECT_RUN_MYSQL_TESTS: "1"
        run: python -m unittest discover -s tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dir: [user, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.dir }}/package-lock.json
      - name: npm ci + test
        run: |
          npm --prefix web/${{ matrix.dir }} ci
          npm --prefix web/${{ matrix.dir }} test
      # 前端产物在这里构建，部署时只下发 dist：服务器没有 npm 构建的 CPU/依赖开销，
      # 也避免"服务器构建和 CI 构建不一致"。CI 的构建失败会直接拦住部署。
      - name: npm run build + 上传 dist
        run: |
          npm --prefix web/${{ matrix.dir }} run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ matrix.dir }}
          path: web/${{ matrix.dir }}/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, assistant, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 长重启期间无输出，必须带 keepalive 防中间层掐连接
      SSH_CMD: ssh -i ~/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 deploy key（服务器网关仅放行 upload/upload-dist/deploy/status/rollback）
        run: |
          install -m600 /dev/stdin ~/deploy_key <<<"${{ secrets.SMARTLECT_DEPLOY_KEY }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: 回滚（inputs.rollback=true 时）
        if: ${{ inputs.rollback }}
        run: $SSH_CMD root@39.107.102.244 rollback
      - name: 打 bundle 并上传
        if: ${{ !inputs.rollback }}
        run: |
          git bundle create deploy.bundle HEAD
          $SSH_CMD root@39.107.102.244 upload < deploy.bundle
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.rollback }}
        with:
          name: web-dist-user
          path: web/user/dist
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.rollback }}
        with:
          name: web-dist-admin
          path: web/admin/dist
      - name: 下发前端 dist（网关新增 upload-dist 动词）
        if: ${{ !inputs.rollback }}
        run: |
          tar czf web-dist.tar.gz web/user/dist web/admin/dist
          ls -la web-dist.tar.gz
          $SSH_CMD root@39.107.102.244 upload-dist < web-dist.tar.gz
      - name: 部署 + 健康门禁（失败即 exit 1）
        if: ${{ !inputs.rollback }}
        run: $SSH_CMD root@39.107.102.244 deploy
      - name: 部署后状态
        if: always()
        run: $SSH_CMD root@39.107.102.244 status || true
