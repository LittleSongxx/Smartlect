<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF5000" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/smartlect.svg" />
    <title>Smartlect · 智选商城</title>
    <script>
      // crypto.randomUUID 是安全上下文（HTTPS/localhost）专属 API，http://IP 下缺失；
      // 经典内联脚本先于所有 ES module 执行，在这里补齐可避免应用初始化即崩溃白屏。
      (function () {
        if (typeof crypto.randomUUID === 'function') return;
        var b = new Uint8Array(16);
        crypto.randomUUID = function () {
          crypto.getRandomValues(b);
          b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
          var h = Array.from(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
          return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
        };
      })();
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
