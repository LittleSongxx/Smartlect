server:
  port: ${SMARTLECT_GATEWAY_PORT:18080}
  shutdown: graceful

spring:
  config:
    import: optional:classpath:smartlect-common.yml
  application:
    name: smartlect-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${SMARTLECT_REDIS_HOST:127.0.0.1}
      port: ${SMARTLECT_REDIS_PORT:16379}
      username: ${SMARTLECT_REDIS_USERNAME:}
      password: ${SMARTLECT_REDIS_PASSWORD:}
      database: ${SMARTLECT_REDIS_DB:0}
      ssl:
        enabled: ${SMARTLECT_REDIS_SSL_ENABLED:false}
  cloud:
    openfeign:
      sentinel:
        enabled: true
    nacos:
      discovery:
        server-addr: ${SMARTLECT_NACOS_ADDR:127.0.0.1:18848}
        username: ${SMARTLECT_NACOS_USERNAME:nacos}
        password: ${SMARTLECT_NACOS_PASSWORD:}
        namespace: ${SMARTLECT_NACOS_NAMESPACE:}
        group: ${SMARTLECT_NACOS_GROUP:SMARTLECT_GROUP}
        prefer-ip-address: true
        # The gateway starts before the business services during local cold starts.
        # Subscribe to Nacos updates and load the initial naming cache so a service
        # registered a few seconds later is not permanently treated as unavailable.
        watch:
          enabled: true
        naming-load-cache-at-start: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    sentinel:
      transport:
        dashboard: ${SMARTLECT_SENTINEL_DASHBOARD:}
      eager: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"status":"error","code":429,"info":"请求过于频繁，请稍后再试","data":null}'
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          global-filter:
            websocket-routing:
              enabled: true
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
            websocket:
              proxy-ping: true
          default-filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                exceptions: java.io.IOException,java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 300ms
                  factor: 2
                  basedOnPreviousValue: false
          routes:
            # Growth and Java Feign call 127.0.0.1 / lb:// directly.
            # Public /internal/** used to let a leaked token impersonate any user.
            - id: admin-user
              uri: lb://smartlect-user
              predicates:
                - Path=/admin-api/account/**,/admin-api/user/**,/admin-api/userInfo/**,/admin-api/userAddress/**,/admin-api/file/**,/admin-api/signRecord/**,/admin-api/signRewardConfig/**,/admin-api/memberLevelRewardConfig/**,/admin-api/imageModeration/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: admin-product
              uri: lb://smartlect-product
              predicates:
                - Path=/admin-api/productInfo/**,/admin-api/productSku/**,/admin-api/productPropertyValue/**,/admin-api/sysCategory/**,/admin-api/sysProductProperty/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: admin-order
              uri: lb://smartlect-order
              predicates:
                - Path=/admin-api/order/**,/admin-api/orderInfo/**,/admin-api/orderItem/**,/admin-api/orderComment/**,/admin-api/commentReport/**,/admin-api/refundReview/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: admin-coupon
              uri: lb://smartlect-coupon
              predicates:
                - Path=/admin-api/discountCoupon/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: admin-cart
              uri: lb://smartlect-cart
              predicates:
                - Path=/admin-api/productCart/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: admin-logistics
              uri: lb://smartlect-order
              predicates:
                - Path=/admin-api/orderLogisticsInfo/**,/admin-api/orderLogisticsInfoRecord/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: assistant
              uri: ${SMARTLECT_GROWTH_BASE_URL:http://127.0.0.1:18000}
              predicates:
                - Path=/api/assistant/**,/admin-api/assistant/**
              metadata:
                response-timeout: 95000
            - id: admin-bff
              uri: lb://smartlect-admin
              predicates:
                - Path=/admin-api/**
              filters:
                - RewritePath=/admin-api/(?<segment>.*), /admin/$\{segment}
            - id: user
              uri: lb://smartlect-user
              predicates:
                - Path=/api/account/**,/api/sign/**,/api/captcha/**,/api/userAddress/**,/api/userBrowse/**,/api/browseHistory/**,/api/userFavorite/**,/api/userMember/**,/api/userNotification/**,/api/location/**,/api/file/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: product
              uri: lb://smartlect-product
              predicates:
                - Path=/api/product/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: cart
              uri: lb://smartlect-cart
              predicates:
                - Path=/api/productCart/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: order
              uri: lb://smartlect-order
              predicates:
                - Path=/api/order/**,/api/orderComment/**,/api/commentReport/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: pay
              uri: lb://smartlect-pay
              predicates:
                - Path=/api/pay/**,/api/payNotify/**,/api/payTrade/**,/api/notify/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: coupon
              uri: lb://smartlect-coupon
              predicates:
                - Path=/api/discountCoupon/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: stock
              uri: lb://smartlect-stock
              predicates:
                - Path=/api/stock/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}
            - id: logistics
              uri: lb://smartlect-order
              predicates:
                - Path=/api/logistics/**,/api/orderLogisticsInfo/**,/api/orderLogisticsInfoRecord/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

smartlect:
  production-ready: ${SMARTLECT_PRODUCTION_READY:false}
  internal:
    token: ${SMARTLECT_INTERNAL_TOKEN:}
    auth-enabled: true
  feign:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  gateway:
    auth:
      enabled: true
      web-exclude-paths:
        - /api/account/autoLogin
        - /api/account/checkCode
        - /api/account/register
        - /api/account/login
        - /api/account/logout
        - /api/account/getEmailCode
        - /api/account/forgetPassword
        - /api/captcha/**
        - /api/product/**
        - /api/discountCoupon/getDiscountCouponDetail
        - /api/discountCoupon/loadDiscountCoupon
        - /api/order/comment/loadComment
        - /api/order/comment/getProductCommentStats
        - /api/file/getResource
        - /api/userMember/getLevelBadge
        - /api/notify/alipayNotify
      admin-exclude-paths:
        - /admin-api/account/checkCode
        - /admin-api/account/login
        - /admin-api/file/getResource
        - /admin-api/file/getResource/**
    rate-limit:
      enabled: true
      default-qps: 200
      auth-qps: 30

app:
  # 网关没有定时任务，也不依赖 smartlect-common（那些 @Scheduled 类根本不在 classpath 上）。
  # 写出来只是为了让"每个服务都对这个开关表过态"这条约束成立，参见
  # SchedulingFlagConsistencyTest。
  common-scheduling:
    enabled: false

# 网关不依赖 smartlect-common，上面的 optional:classpath:smartlect-common.yml 导入不生效，
# 所以 management 这段要在本地重复一次
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name:smartlect-gateway}
  prometheus:
    metrics:
      export:
        enabled: true
