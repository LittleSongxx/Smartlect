server:
  port: ${SMARTLECT_USER_PORT:18082}
  shutdown: graceful

spring:
  config:
    import:
      # 本地 classpath 兜底优先级最低；Nacos 可达且存在同名 dataId 时以后者为准。
      # 三者都写 optional：配置中心缺失/不可达时退回本地 yml，而不是启动失败。
      - optional:classpath:smartlect-common.yml
      - optional:nacos:smartlect-common.yml?group=SMARTLECT_GROUP&refreshEnabled=false
      - optional:nacos:smartlect-user.yml?group=SMARTLECT_GROUP&refreshEnabled=false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: smartlect-user
  cloud:
    openfeign:
      sentinel:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        ttl: 10s
        capacity: 256
      health-check:
        initial-delay: 0
        interval: 15s
        path:
          default: /actuator/health
      retry:
        enabled: true
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        retry-on-all-operations: false
        avoid-previous-instance: true
    nacos:
      config:
        server-addr: ${SMARTLECT_NACOS_ADDR:127.0.0.1:18848}
        username: ${SMARTLECT_NACOS_USERNAME:}
        password: ${SMARTLECT_NACOS_PASSWORD:}
        group: SMARTLECT_GROUP
      discovery:
        server-addr: ${SMARTLECT_NACOS_ADDR:127.0.0.1:18848}
        username: ${SMARTLECT_NACOS_USERNAME:nacos}
        password: ${SMARTLECT_NACOS_PASSWORD:}
        namespace: ${SMARTLECT_NACOS_NAMESPACE:}
        group: ${SMARTLECT_NACOS_GROUP:SMARTLECT_GROUP}
        prefer-ip-address: true
        heart-beat-interval: 5
        heart-beat-timeout: 15
        ip-delete-timeout: 30
    sentinel:
      transport:
        dashboard: ${SMARTLECT_SENTINEL_DASHBOARD:}
      eager: true
  datasource:
    url: jdbc:mysql://${SMARTLECT_MYSQL_HOST:127.0.0.1}:${SMARTLECT_MYSQL_PORT:13306}/smartlect_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&useSSL=false
    username: ${SMARTLECT_MYSQL_USER:smartlect_app}
    password: ${SMARTLECT_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    user: ${SMARTLECT_FLYWAY_USER:smartlect_flyway}
    password: ${SMARTLECT_FLYWAY_PASSWORD:}
  data:
    redis:
      host: ${SMARTLECT_REDIS_HOST:127.0.0.1}
      port: ${SMARTLECT_REDIS_PORT:16379}
      username: ${SMARTLECT_REDIS_USERNAME:}
      password: ${SMARTLECT_REDIS_PASSWORD:}
      database: ${SMARTLECT_REDIS_DB:0}
      ssl:
        enabled: ${SMARTLECT_REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${SMARTLECT_RABBIT_HOST:127.0.0.1}
    port: ${SMARTLECT_RABBIT_PORT:15672}
    username: ${SMARTLECT_RABBIT_USER:smartlect}
    password: ${SMARTLECT_RABBIT_PASSWORD:}
    virtual-host: ${SMARTLECT_RABBIT_VHOST:smartlect}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

mybatis:
  mapper-locations: classpath*:com/smartlect/mappers/*.xml
  type-aliases-package: com.smartlect.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  # UserTempBanReconcileTask（临时封禁到期解封）挂在这个开关上；写成 false
  # 会让它连 Bean 都不注册——任务从此永不执行，且没有任何报错提示。
  common-scheduling:
    enabled: true
