spring:
  datasource:
    hikari:
      # Ten local services share one MySQL container. Conservative defaults
      # prevent idle pools from exhausting max_connections and container RAM;
      # production can raise them after measuring per-service concurrency.
      minimum-idle: ${SMARTLECT_DB_POOL_MIN_IDLE:1}
      maximum-pool-size: ${SMARTLECT_DB_POOL_MAX_SIZE:4}
      connection-timeout: ${SMARTLECT_DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${SMARTLECT_DB_POOL_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${SMARTLECT_DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${SMARTLECT_DB_POOL_MAX_LIFETIME_MS:1800000}
  rabbitmq:
    connection-timeout: ${SMARTLECT_RABBIT_CONNECTION_TIMEOUT_MS:5000}
    requested-heartbeat: ${SMARTLECT_RABBIT_REQUESTED_HEARTBEAT_SECONDS:30s}
    listener:
      simple:
        concurrency: ${SMARTLECT_RABBIT_LISTENER_CONCURRENCY:1}
        max-concurrency: ${SMARTLECT_RABBIT_LISTENER_MAX_CONCURRENCY:4}
  flyway:
    enabled: ${SMARTLECT_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration

amap:
  key: ${SMARTLECT_AMAP_KEY:}

project:
  folder: ${SMARTLECT_PROJECT_FOLDER:./run/uploads/}
  domain: ${SMARTLECT_PROJECT_DOMAIN:}
  auto-checkpay: ${SMARTLECT_PROJECT_AUTO_CHECKPAY:false}

admin:
  account: ${SMARTLECT_ADMIN_ACCOUNT:admin}
  password: ${SMARTLECT_ADMIN_PASSWORD:}
  emails: ${SMARTLECT_ADMIN_EMAILS:}

alipay:
  appid: ${SMARTLECT_ALIPAY_APPID:}
  sellerId: ${SMARTLECT_ALIPAY_SELLER_ID:}
  appPrivateKey: ${SMARTLECT_ALIPAY_APP_PRIVATE_KEY:}
  appCertPath: ${SMARTLECT_ALIPAY_APP_CERT_PATH:}
  alipayPublicCertPath: ${SMARTLECT_ALIPAY_PUBLIC_CERT_PATH:}
  alipayRootCertPath: ${SMARTLECT_ALIPAY_ROOT_CERT_PATH:}
  serverUrl: ${SMARTLECT_ALIPAY_SERVER_URL:https://openapi.alipay.com/gateway.do}
  connectTimeoutMs: ${SMARTLECT_ALIPAY_CONNECT_TIMEOUT_MS:3000}
  readTimeoutMs: ${SMARTLECT_ALIPAY_READ_TIMEOUT_MS:8000}

order:
  expire:
    minute: ${SMARTLECT_ORDER_EXPIRE_MINUTE:15}
    ms: ${SMARTLECT_ORDER_EXPIRE_MS:900000}
  confirm:
    minute: ${SMARTLECT_ORDER_CONFIRM_MINUTE:10080}
    ms: ${SMARTLECT_ORDER_CONFIRM_MS:604800000}

rush:
  prepare:
    expire-second: ${SMARTLECT_RUSH_PREPARE_EXPIRE_SECOND:900}

baidu:
  aip:
    enabled: ${SMARTLECT_BAIDU_AIP_ENABLED:false}
    api-key: ${SMARTLECT_BAIDU_AIP_API_KEY:}
    secret-key: ${SMARTLECT_BAIDU_AIP_SECRET_KEY:}

smartlect:
  demo:
    enabled: ${SMARTLECT_DEMO_ENABLED:false}
    password: ${SMARTLECT_DEMO_PASSWORD:}
  trial:
    enabled: ${SMARTLECT_TRIAL_ENABLED:true}
    password: ${SMARTLECT_TRIAL_PASSWORD:Visit-Smartlect-2026}
    lock-public-register: ${SMARTLECT_TRIAL_LOCK_PUBLIC_REGISTER:true}
  payment:
    mode: ${SMARTLECT_PAYMENT_MODE:mock}
  growth:
    base-url: ${SMARTLECT_GROWTH_BASE_URL:http://127.0.0.1:18000}
    attribution-connect-timeout-ms: ${SMARTLECT_GROWTH_ATTRIBUTION_CONNECT_TIMEOUT_MS:200}
    attribution-read-timeout-ms: ${SMARTLECT_GROWTH_ATTRIBUTION_READ_TIMEOUT_MS:500}
  production-ready: ${SMARTLECT_PRODUCTION_READY:false}
  dev-login-bypass: ${SMARTLECT_DEV_LOGIN_BYPASS:false}
  internal:
    token: ${SMARTLECT_INTERNAL_TOKEN:}
    # 高风险运维接口使用独立令牌；空值时接口保持关闭。
    ops-token: ${SMARTLECT_INTERNAL_OPS_TOKEN:}
    auth-enabled: ${SMARTLECT_INTERNAL_AUTH_ENABLED:true}
  feign:
    connect-timeout-ms: ${SMARTLECT_FEIGN_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SMARTLECT_FEIGN_READ_TIMEOUT_MS:10000}
  sentinel:
    feign-rules-enabled: ${SMARTLECT_SENTINEL_FEIGN_RULES:true}

seata:
  enabled: ${SMARTLECT_SEATA_ENABLED:true}
  application-id: ${spring.application.name:smartlect}
  tx-service-group: ${SMARTLECT_SEATA_TX_GROUP:smartlect_tx_group}
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      smartlect_tx_group: default
      default_tx_group: default
  # Seata Server 向 Nacos 注册（SEATA_GROUP），客户端通过 Nacos 发现，
  # 无需硬编码地址，扩缩容时自动感知。
  registry:
    type: nacos
    nacos:
      server-addr: ${SMARTLECT_NACOS_ADDR:127.0.0.1:18848}
      username: ${SMARTLECT_NACOS_USERNAME:nacos}
      password: ${SMARTLECT_NACOS_PASSWORD:}
      # Keep the empty namespace explicit for the bundled Nacos 2.5.x
      # compatibility bridge: Nacos 3.x clients otherwise default to "public".
      namespace: ${SMARTLECT_NACOS_NAMESPACE:}
      group: SMARTLECT_SEATA_GROUP
      application: smartlect-seata
      cluster: default
  config:
    type: file

# /actuator/prometheus 无鉴权，会暴露 URI 模板、SQL、线程池等内部细节。
# 这里沿用既有做法：actuator 留在业务端口，由 Nginx / 网关不对外反代 /actuator 来隔离
# （见 deploy/nginx.smartlect.conf.example、deploy/上线检查清单.md），Prometheus 只从内网抓。
# 不能改 management.server.port：spring.cloud.loadbalancer 的 health-check 探的是
# 注册到 Nacos 的业务端口 /actuator/health，挪走会让所有实例被判定下线。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      # 所有指标带上服务名，Grafana 里才能按服务下钻
      application: ${spring.application.name:smartlect}
  prometheus:
    metrics:
      export:
        enabled: true
