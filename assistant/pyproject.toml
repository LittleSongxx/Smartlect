[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlect-assistant"
version = "0.1.0"
description = "Smartlect AI assistant service: bounded shopping agent, knowledge, recommendations, ledger"
requires-python = ">=3.11"
dependencies = [
    "pika==1.4.1", "PyMySQL[rsa]==1.2.0", "cryptography==50.0.1",
    "cffi==2.1.1", "pycparser==3.0",
    "fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.32.1",
    "langgraph==1.0.10", "httpx==0.28.1", "python-dotenv==1.2.2", "pypdf==6.18.0",
    "jieba==0.42.1", "tiktoken==0.12.0",
    "psycopg[binary,pool]==3.3.2", "langgraph-checkpoint-postgres==3.0.4",
    "langfuse==3.14.1",
    "PyJWT==2.10.1",
    "prometheus-fastapi-instrumentator==8.1.0",
    "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0", "opentelemetry-instrumentation-httpx==0.65b0",
]

[project.scripts]
smartlect-assistant = "smartlect.app:main"
smartlect-assistant-worker = "smartlect.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/*"]

[tool.setuptools.package-data]
smartlect = ["migrations/*.sql", "skills/*.json"]
