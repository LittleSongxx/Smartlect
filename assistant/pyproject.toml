[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlect-assistant"
version = "0.1.0"
description = "Smartlect AI assistant service: bounded shopping agent, knowledge, proposals, sub-agent dispatch"
requires-python = ">=3.11"
dependencies = [
    "openai==3.14.1", "PyMySQL[rsa]==1.2.0", "cryptography==50.0.1",
    "cffi==2.1.1", "pycparser==3.0",
    "fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.32.1",
    "langgraph==1.2.12", "httpx==0.28.1", "pypdf==6.18.0",
    # aiohttp 必须显式声明：AsyncElasticsearch 走 elastic_transport 的 aiohttp 节点，
    # 缺它会在初始化时抛 ValueError 并被 ensure_schema 吞掉，表现为「ES 检索全部静默跳过」，
    # 知识永远命中不了（2026-10-08 线上就是这么答不出店规问题的）。
    "elasticsearch[async]==8.19.0", "aiohttp>=3.9", "qdrant-client==1.15.1",
    "jieba==0.42.1", "tiktoken==0.12.0",
    "langfuse==3.14.1",
    "PyJWT==2.10.1",
    "prometheus-fastapi-instrumentator==8.1.0",
    "opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0", "opentelemetry-instrumentation-httpx==0.65b0",
]

[project.scripts]
smartlect-assistant = "smartlect.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/*"]

[tool.setuptools.package-data]
smartlect = ["migrations/*.sql", "skills/*.json"]
